<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | Renu Super Shopie</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-page="checkout"><div id="site-header"></div><main><section class="page-hero"><div class="section-shell"><p class="eyebrow">ALMOST YOURS</p><h1>Checkout.</h1></div></section><section class="section-shell checkout-layout"><form class="checkout-form" data-checkout-form><div class="field full"><label for="full-name">Full name</label><input id="full-name" name="name" required></div><div class="field"><label for="mobile">Mobile number</label><input id="mobile" name="mobile" type="tel" pattern="[0-9]{10}" required></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div><div class="field full"><label for="address">Address</label><textarea id="address" name="address" required></textarea></div><div class="field"><label for="city">City</label><input id="city" name="city" required></div><div class="field"><label for="state">State</label><input id="state" name="state" required></div><div class="field"><label for="pin">PIN code</label><input id="pin" name="pin" pattern="[0-9]{6}" required></div><div class="field full"><span class="option-label">Payment method</span><div class="payment-options"><label><input type="radio" name="payment" value="Cash on Delivery" checked>Cash on Delivery</label><label><input type="radio" name="payment" value="Online Payment - Demo">Online Payment — Demo</label></div></div><button class="button button-primary full-button" type="submit">Place order</button><p class="form-message full" data-checkout-message aria-live="polite"></p></form><aside class="cart-summary" data-checkout-summary></aside></section></main><div id="site-footer"></div><script type="module" src="js/checkout.js"></script></body></html>
