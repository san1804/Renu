<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact | Renu Super Shopie</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main><section class="page-hero"><div class="section-shell"><p class="eyebrow">WE ARE HERE TO HELP</p><h1>Let's talk.</h1></div></section><section class="section-shell section-block"><div class="checkout-layout"><div><h2>Customer care</h2><p class="detail-description">For questions about an order, sizing, shipping or returns, write to us and our small team will get back to you within one working day.</p><p><strong>hello@renusupershopie.in</strong><br>Mon to Sat · 10:00 to 18:00 IST</p></div><form class="checkout-form" data-contact-form><div class="field full"><label for="contact-name">Name</label><input id="contact-name" required></div><div class="field full"><label for="contact-email">Email</label><input id="contact-email" type="email" required></div><div class="field full"><label for="contact-message">Message</label><textarea id="contact-message" required></textarea></div><button class="button button-primary" type="submit">Send message</button><p class="form-message" data-contact-message aria-live="polite"></p></form></div></section></main><div id="site-footer"></div><script type="module" src="js/main.js"></script><script>document.querySelector('[data-contact-form]')?.addEventListener('submit',event=>{event.preventDefault();event.currentTarget.querySelector('[data-contact-message]').textContent='Thank you. We will be in touch shortly.';event.currentTarget.reset()})</script></body></html>
